<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="empleado"></title>
    <link rel="icon" href="sam.svg" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Single:wght@600&family=Cascadia+Mono:ital,wght@0,200..700;1,200..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <header>
        <label id="nombre_usuario"></label>
        <button onclick="logout()">Cerrar sesion</button>
    </header>
    <div class="content">
        <table class="list" id="empleados">
        </table>
    </div>
    <footer>
        <select id="filtrar_empleado" placeholder="Ordenar por...">
            <option value="conectado">Conectado</option>
            <option value="ultima_coneccion">Ultima coneccion</option>
            <option value="nombre">Nombre</option>
            <option value="descanso">En descanso</option>
        </select>
        <button id="new_user" onclick="crearEmpleado()">+</button>
    </footer>
    <dialog id="modalDetalles">
    <h2>Detalles del empleado</h2>
    <p><strong>Nombre:</strong> <span id="det_nombre"></span></p>
    <p><strong>Cédula:</strong> <span id="det_cedula"></span></p>
    <p><strong>Jornada:</strong> <span id="det_jornada"></span></p>
    <button onclick="cerrarDetalles()">Cerrar</button>
    </dialog>
    <dialog id="modalDescanso">
    <h2>Horario: <span id="desc_nombre"></span></h2>
    <p><strong>Estado:</strong> <span id="desc_estado"></span></p>
    <p><strong>Descanso usado:</strong> <span id="desc_usado"></span></p>
    <p><strong>Descanso permitido:</strong> <span id="desc_permitido"></span></p>
    <p><strong>Balance:</strong> <span id="desc_balance"></span></p>
    <h3>Turnos recientes</h3>
    <div class="modal-scroll">
        <table id="tablaDescansoHist"></table>
    </div>
    <button onclick="cerrarDescanso()">Cerrar</button>
    </dialog>
    <script src="main.js"></script> 
</body>
</html>
