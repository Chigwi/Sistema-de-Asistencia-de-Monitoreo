spring.application.name=S-A-M

# Datasource and its configs

spring.datasource.url=jdbc:postgresql://localhost:5432/SAM
spring.datasource.username= user
spring.datasource.password=Servidor123
spring.datasource.driver-class-name=org.postgresql.Driver


# JPA/Hibernate settings (SHARED - use once, not repeated)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
